server:
  port: 8080

solon:
  app:
    name: wqs-admin
    group: com.wqs

wqs:
  # 数据库配置示例 (请修改为实际数据库地址)
  db:
    url: "jdbc:mysql://120.53.227.18:3306/wqs_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"
    username: "root"
    password: "Jetox8087."
    driverClassName: "com.mysql.cj.jdbc.Driver"
  # Redis 配置
  redis:
    server: "127.0.0.1:6379"
    # password: ""
    db: 0
    maxTotal: 200

mybatis:
  db1:
    scan: "com.wqs.admin.mapper"
  plus:
    configuration:
      mapUnderscoreToCamelCase: true
      logImpl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

sa-token: 
  # token名称 (同时也是cookie名称)
  token-name: wqs-admin-token
  # token有效期，单位s 默认30天, -1代表永不过期 
  timeout: 2592000
  # token临时有效期 (指定时间无操作就过期) 默认-1 代表不限制
  activity-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录) 
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token) 
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出操作日志 
  is-log: false
